<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#000000" />
  <title>VisionOS AR — Spatial Computing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

<div id="splash">
  <div class="splash-orb"></div>
  <div class="splash-logo">
    <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
      <circle cx="32" cy="32" r="28" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
      <circle cx="32" cy="32" r="20" stroke="rgba(120,200,255,0.6)" stroke-width="1.5"/>
      <circle cx="32" cy="32" r="10" fill="rgba(120,200,255,0.15)" stroke="rgba(120,200,255,0.9)" stroke-width="1.5"/>
      <path d="M22 32 Q32 20 42 32 Q32 44 22 32Z" fill="rgba(120,200,255,0.2)" stroke="rgba(120,200,255,0.7)" stroke-width="1"/>
    </svg>
    <span>VisionOS AR</span>
  </div>
  <div class="splash-progress">
    <div class="splash-bar" id="splashBar"></div>
  </div>
  <div class="splash-status" id="splashStatus">Initializing spatial engine…</div>
</div>

<video id="cameraFeed" autoplay playsinline muted></video>
<video id="handVideo" autoplay playsinline muted style="display:none;"></video>
<canvas id="threeCanvas"></canvas>
<canvas id="handCanvas"></canvas>

<div id="cursor">
  <div class="cursor-ring"></div>
  <div class="cursor-dot"></div>
</div>

<div id="gestureHud" class="glass-panel">
  <div class="hud-label">GESTURE</div>
  <div id="gestureText">—</div>
  <div class="gesture-bars">
    <div class="gbar" id="gbarPinch"><span>Pinch</span><div class="gfill" id="fillPinch"></div></div>
    <div class="gbar" id="gbarGrab"><span>Grab</span><div class="gfill" id="fillGrab"></div></div>
    <div class="gbar" id="gbarSwipe"><span>Swipe</span><div class="gfill" id="fillSwipe"></div></div>
  </div>
</div>

<div id="dock" class="glass-panel dock">
  <button class="dock-btn active" data-mode="ar">
    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    <span>AR</span>
  </button>
  <button class="dock-btn" data-mode="vr">
    <svg viewBox="0 0 24 24"><rect x="2" y="8" width="20" height="10" rx="3"/><circle cx="8" cy="13" r="2"/><circle cx="16" cy="13" r="2"/><path d="M11 13h2"/></svg>
    <span>VR</span>
  </button>
  <button class="dock-btn" data-mode="train">
    <svg viewBox="0 0 24 24"><path d="M18 11V6.5a2.5 2.5 0 0 0-5 0v6M18 11a3 3 0 0 1 3 3v2a7 7 0 0 1-7 7h-2a7 7 0 0 1-7-7v-2a3 3 0 0 1 3-3"/><path d="M13 6.5V3a2.5 2.5 0 0 0-5 0v8M8 11V5a2.5 2.5 0 0 0-5 0v6a3 3 0 0 0 3 3"/></svg>
    <span>Train</span>
  </button>
  <button class="dock-btn" data-mode="settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
    <span>Setup</span>
  </button>
</div>

<div id="windowsLayer"></div>

<div id="trainPanel" class="glass-panel spatial-window hidden">
  <div class="win-header">
    <div class="win-title">Gesture Training</div>
    <button class="win-close" data-close="trainPanel">✕</button>
  </div>
  <div class="train-target">
    <div id="trainIcon" class="train-icon">✋</div>
    <div id="trainLabel" class="train-label">PINCH</div>
    <div id="trainDesc" class="train-desc">Touch thumb and index finger together</div>
  </div>
  <div class="train-score-wrap">
    <div class="score-ring">
      <svg viewBox="0 0 80 80">
        <circle cx="40" cy="40" r="34" class="score-bg"/>
        <circle cx="40" cy="40" r="34" class="score-fill" id="scoreArc"/>
      </svg>
      <div class="score-num" id="scoreNum">0</div>
    </div>
    <div class="score-info">
      <div class="score-label">Score</div>
      <div id="streakVal" class="streak-val">🔥 0</div>
    </div>
  </div>
  <div class="train-progress-label">Next gesture in <span id="trainCountdown">3</span>s</div>
  <div class="train-history" id="trainHistory"></div>
</div>

<div id="settingsPanel" class="glass-panel spatial-window hidden">
  <div class="win-header">
    <div class="win-title">Settings</div>
    <button class="win-close" data-close="settingsPanel">✕</button>
  </div>
  <div class="settings-list">
    <div class="setting-row">
      <span>Hand Tracking</span>
      <label class="toggle"><input type="checkbox" id="togHands" checked/><span class="slider"></span></label>
    </div>
    <div class="setting-row">
      <span>AR Passthrough</span>
      <label class="toggle"><input type="checkbox" id="togAR" checked/><span class="slider"></span></label>
    </div>
    <div class="setting-row">
      <span>Stereo VR</span>
      <label class="toggle"><input type="checkbox" id="togStereo"/><span class="slider"></span></label>
    </div>
    <div class="setting-row">
      <span>Skeleton Overlay</span>
      <label class="toggle"><input type="checkbox" id="togSkeleton" checked/><span class="slider"></span></label>
    </div>
    <div class="setting-row">
      <span>FPS Limit: <span id="fpsLabel">60</span></span>
      <input type="range" min="30" max="120" value="60" id="fpsSlider" class="range-input"/>
    </div>
    <div class="setting-row">
      <span>IPD (VR mm): <span id="ipdLabel">63</span></span>
      <input type="range" min="55" max="72" value="63" id="ipdSlider" class="range-input"/>
    </div>
  </div>
  <button class="btn-primary" id="btnEnterVR">Enter VR Cardboard</button>
</div>

<div id="fpsCounter" class="fps-counter">60 FPS</div>

<div id="vrOverlay" class="hidden">
  <div id="vrLeft" class="vr-eye"></div>
  <div id="vrRight" class="vr-eye"></div>
  <div class="vr-divider"></div>
  <div id="vrHUD" class="vr-hud">
    <span id="vrMode">◉ VR MODE</span>
    <button id="vrExit" onclick="exitVR()">EXIT</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
